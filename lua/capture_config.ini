; capture_config.ini - configuration for capture_screens.lua
;
; [activo]
;   historia=<route>     Route to run. Its name is also the name of the folder
;                        (inside CARPETA_RUTAS_BASE) where the captures are written.
;                        The folder must not exist yet: rename or move old ones first.
;
; [<route>]  (one section per route)
;   P<k>=<1|2>           Option to pick at the k-th question of the route.
;                        Questions without an entry use option 1.
;   tope=<n>             NOT WORKING: the value is read but ignored by the script.
;                        The capture ends by itself when the game stops showing new
;                        screens (25 attempts of 40 frames each, about 13 seconds
;                        without a new screen, which is what happens at the end of a
;                        story), or at 500 screens (MAX_PANTALLAS in capture_screens.lua).
;
; One example route per story:
;   H1B .. H5B   answer every question with option 2
;   H6DORADO     answers of the route that leads to the "Dorado" ending of story 6

